<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:#1A1A2E;background:#fff;}
a{text-decoration:none;color:inherit;}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;display:inline-block;white-space:nowrap;}
.lift{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;}
.lift:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(5,39,96,.13);}
</style>
</helmet>

<div data-screen-label="Médiathèque photos" style="font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1A1A2E;background:#fff;min-height:100vh;">

  <dc-import name="header" active="actu" hint-size="100%,130px"></dc-import>

  <div style="background:#EFF1F4;">
    <div style="max-width:1360px;margin:0 auto;padding:14px 24px 0;font-size:12.5px;color:#8A95A2;display:flex;align-items:center;gap:7px;">
      <a href="accueil.dc.html" style="color:#0849B3;font-weight:600;">Accueil</a>
      <span class="ms" style="font-size:15px;">chevron_right</span>
      <span>Actualités &amp; Médias</span>
      <span class="ms" style="font-size:15px;">chevron_right</span>
      <span>Médiathèque (photos)</span>
    </div>
  </div>

  <section style="background:#EFF1F4;padding:36px 0 70px;">
    <div style="max-width:1360px;margin:0 auto;padding:0 24px;">
      <div style="background:#fff;border-radius:14px;padding:44px 48px 48px;">

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <div style="width:26px;height:3px;background:#0849B3;border-radius:2px;"></div>
          <span style="font-size:12px;letter-spacing:.18em;color:#0849B3;font-weight:700;">MÉDIATHÈQUE</span>
        </div>
        <h1 style="font-size:32px;font-weight:700;color:#052760;margin:0 0 8px;letter-spacing:-.01em;">Photothèque</h1>
        <p style="font-size:15px;color:#5A6675;margin:0 0 28px;max-width:640px;line-height:1.6;">Les images officielles des activités de l'Inspection Générale des Finances.</p>

        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:28px;">
          <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
            <span onClick="{{c.go}}" style="font-size:13.5px;font-weight:600;padding:9px 20px;border-radius:30px;cursor:pointer;background:{{c.bg}};color:{{c.fg}};border:1px solid {{c.bd}};">{{c.label}} <span style="opacity:.65;">({{c.count}})</span></span>
          </sc-for>
        </div>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;">
          <sc-for list="{{photos}}" as="p" hint-placeholder-count="6">
            <div class="lift" style="background:#fff;border:1px solid #EBEEF3;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(5,39,96,.05);cursor:pointer;">
              <div style="position:relative;height:210px;overflow:hidden;">
                <img src="{{p.photo}}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
                <div style="position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center;"><span class="ms" style="font-size:19px;color:#0849B3;">zoom_in</span></div>
              </div>
              <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 16px;">
                <span style="font-size:12px;font-weight:700;color:#052760;">{{p.date}}</span>
                <span style="font-size:10.5px;font-weight:700;letter-spacing:.06em;color:#0849B3;background:#EAF0FC;padding:3px 9px;border-radius:3px;">{{p.tag}}</span>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:38px;">
          <div onClick="{{onPrev}}" style="width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #E4E8EE;box-shadow:0 3px 10px rgba(5,39,96,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;"><span class="ms" style="font-size:19px;color:#0849B3;">arrow_back</span></div>
          <sc-for list="{{pages}}" as="pg" hint-placeholder-count="3">
            <div onClick="{{pg.go}}" style="min-width:40px;height:40px;padding:0 6px;border-radius:50%;border:1px solid {{pg.bd}};background:{{pg.bg}};color:{{pg.fg}};font-size:13.5px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;">{{pg.n}}</div>
          </sc-for>
          <div onClick="{{onNext}}" style="width:40px;height:40px;border-radius:50%;background:#fff;border:1px solid #E4E8EE;box-shadow:0 3px 10px rgba(5,39,96,.1);display:flex;align-items:center;justify-content:center;cursor:pointer;"><span class="ms" style="font-size:19px;color:#0849B3;">arrow_forward</span></div>
        </div>

      </div>
    </div>
  </section>

  <dc-import name="footer" hint-size="100%,430px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { cat:'Photos conférence', page:1 };
  renderVals(){
    const catDefs = [
      {label:'Photos conférence', count:38},
      {label:'Photos audience', count:30},
      {label:'Photos divers', count:6},
      {label:'Photos évènement', count:80}
    ];
    const cats = catDefs.map(c=>({ ...c, go:()=>this.setState({cat:c.label, page:1}),
      bg:this.state.cat===c.label?'#0849B3':'#fff', fg:this.state.cat===c.label?'#fff':'#5A6675', bd:this.state.cat===c.label?'#0849B3':'#E0E5EB' }));

    const imgs = ['assets/photo-discours.png','assets/photo-salle.png','assets/photo-foule.png','assets/photo-president.png','assets/photo-inauguration.png','assets/photo-embleme.png','assets/building-1.png','assets/building-2.png'];
    const dates = ['21-05-2026','21-05-2026','21-05-2026','08-12-2025','08-12-2025','31-10-2025','31-10-2025','08-10-2024','08-10-2024','12-09-2024','12-09-2024','04-07-2024'];
    const tagMap = {'Photos conférence':'CONFÉRENCE','Photos audience':'AUDIENCE','Photos divers':'DIVERS','Photos évènement':'ÉVÈNEMENT'};
    const tag = tagMap[this.state.cat];
    // demo dataset: 12 entries per category, cycling through available images
    const seed = catDefs.findIndex(c=>c.label===this.state.cat);
    const allPhotos = dates.map((d,i)=>({ date:d, tag, photo: imgs[(i+seed*3)%imgs.length] }));

    const perPage = 6;
    const pageCount = Math.ceil(allPhotos.length/perPage);
    const page = Math.min(this.state.page, pageCount);
    const photos = allPhotos.slice((page-1)*perPage, page*perPage);
    const pages = Array.from({length:pageCount},(_,i)=>i+1).map(n=>({ n, go:()=>this.setState({page:n}),
      bg:n===page?'#0849B3':'#fff', fg:n===page?'#fff':'#5A6675', bd:n===page?'#0849B3':'#E4E8EE' }));

    return { cats, photos, pages,
      onPrev:()=>this.setState(s=>({page:Math.max(1,s.page-1)})),
      onNext:()=>this.setState(s=>({page:Math.min(pageCount,s.page+1)})) };
  }
}
</script>
</body>
</html>
