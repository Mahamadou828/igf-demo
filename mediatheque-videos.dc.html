<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
body{margin:0;font-family:'Hanken Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;color:#1A1A2E;background:#fff;}
a{text-decoration:none;color:inherit;}
.ms{font-family:'Material Symbols Outlined';font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;display:inline-block;white-space:nowrap;}
.lift{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;}
.lift:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(5,39,96,.13);}
</style>
</helmet>

<div data-screen-label="Médiathèque vidéos" style="font-family:'Hanken Grotesk',system-ui,sans-serif;color:#1A1A2E;background:#fff;min-height:100vh;">

  <dc-import name="header" active="actu" hint-size="100%,130px"></dc-import>

  <div style="background:#EFF1F4;">
    <div style="max-width:1360px;margin:0 auto;padding:14px 24px 0;font-size:12.5px;color:#8A95A2;display:flex;align-items:center;gap:7px;">
      <a href="accueil.dc.html" style="color:#0849B3;font-weight:600;">Accueil</a>
      <span class="ms" style="font-size:15px;">chevron_right</span>
      <span>Actualités &amp; Médias</span>
      <span class="ms" style="font-size:15px;">chevron_right</span>
      <span>Médiathèque (vidéos)</span>
    </div>
  </div>

  <section style="background:#EFF1F4;padding:36px 0 70px;">
    <div style="max-width:1360px;margin:0 auto;padding:0 24px;">
      <div style="background:#fff;border-radius:14px;padding:44px 48px 48px;">

        <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
          <div style="width:26px;height:3px;background:#0849B3;border-radius:2px;"></div>
          <span style="font-size:12px;letter-spacing:.18em;color:#0849B3;font-weight:700;">MÉDIATHÈQUE</span>
        </div>
        <h1 style="font-size:32px;font-weight:700;color:#052760;margin:0 0 8px;letter-spacing:-.01em;">Vidéos</h1>
        <p style="font-size:15px;color:#5A6675;margin:0 0 30px;max-width:640px;line-height:1.6;">Reportages, séminaires et émissions officielles de l'Inspection Générale des Finances.</p>

        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:22px;">
          <sc-for list="{{videos}}" as="v" hint-placeholder-count="6">
            <a class="lift" style="background:#fff;border:1px solid #EBEEF3;border-radius:10px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(5,39,96,.05);cursor:pointer;">
              <div style="position:relative;height:190px;overflow:hidden;">
                <img src="{{v.photo}}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">
                <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,20,50,.15),rgba(3,20,50,.45));"></div>
                <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);"><span class="ms" style="font-size:29px;color:#E03C31;">play_arrow</span></div>
                <span style="position:absolute;right:10px;bottom:10px;font-size:11px;font-weight:700;color:#fff;background:rgba(0,0,0,.65);padding:3px 8px;border-radius:3px;">{{v.dur}}</span>
              </div>
              <div style="padding:16px 18px 18px;display:flex;flex-direction:column;flex:1;">
                <span style="font-size:11.5px;color:#8A95A2;margin-bottom:7px;display:inline-flex;align-items:center;gap:6px;"><span class="ms" style="font-size:15px;">calendar_today</span>{{v.date}}</span>
                <h3 style="font-size:15.5px;font-weight:700;color:#052760;line-height:1.4;margin:0;">{{v.title}}</h3>
              </div>
            </a>
          </sc-for>
        </div>

      </div>
    </div>
  </section>

  <dc-import name="footer" hint-size="100%,430px"></dc-import>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  renderVals(){
    return { videos: [
      {title:'Cinquième jour du séminaire IGF-Médias et société civile', date:'16/06/2026', dur:'5:12', photo:'assets/photo-discours.png'},
      {title:'Quatrième jour du séminaire IGF-Médias et société civile', date:'16/06/2026', dur:'4:38', photo:'assets/photo-salle.png'},
      {title:'Troisième jour du séminaire IGF-Médias et société civile', date:'16/06/2026', dur:'6:05', photo:'assets/photo-foule.png'},
      {title:'Deuxième jour du séminaire IGF-Médias et société civile', date:'16/06/2026', dur:'3:47', photo:'assets/photo-president.png'},
      {title:'Premier jour du séminaire IGF-Médias et société civile', date:'15/06/2026', dur:'5:54', photo:'assets/photo-inauguration.png'},
      {title:"Échos de l'IGF du mois de mai", date:'02/06/2026', dur:'8:21', photo:'assets/photo-embleme.png'}
    ]};
  }
}
</script>
</body>
</html>
